# ================================================================
# galaxies.yaml — Target list and per-galaxy continuum-subtraction choices
# ================================================================
# Edit this file when a galaxy needs a different input file, filter choice,
# HDU index, or rerun behavior. Most reruns should only need changes here.
#
# Useful override examples:
#
# overrides:
#   ngc5068:
#     overwrite: true
#     f658n_file: "/full/path/to/specific_ngc5068_f658n_file.fits"
#     f658n_error_file: "/full/path/to/specific_ngc5068_f658n_err_drc_wht.fits"
#   ngc2903:
#     preferred_instruments: ["acs", "uvis"]
# ================================================================

defaults:
  broad_filters: ["f555w", "f814w"]
  narrow_filters: ["f657n", "f658n"]
  preferred_instruments: ["uvis", "acs"]
  hdu_index: 0
  overwrite: true
  write_continuum: true
  contsub_space: "linear"
  coverage_mask:
    enabled: true
    closing_size: 10
    closing_iterations: 5
  require_errors: true
  narrowband_width_header: "PHOTBW"
  narrowband_widths: {}
  nii_to_halpha: 0.25
  output_unit: "erg/s/cm2/arcsec2"

# HST subfield run targets such as ngc628c/ngc2997w are valid here; foreground
# extinction sample-table lookup falls back to the base galaxy for c/e/n/s/w suffixes.
galaxies:
  - ngc5194

overrides:
  ngc5194:
    preferred_instruments: ["acs"]
    narrow_filters: ["f658n"]
    require_errors: false
    f555w_file: "/Users/abarnes/Library/CloudStorage/Dropbox/Data/Extragalactic/m51/hst/hlsp_heritage_hst_acs-wfc_m51_f555w_v1_drz.fits"
    f658n_file: "/Users/abarnes/Library/CloudStorage/Dropbox/Data/Extragalactic/m51/hst/hlsp_heritage_hst_acs-wfc_m51_f658n_v1_drz.fits"
    f814w_file: "/Users/abarnes/Library/CloudStorage/Dropbox/Data/Extragalactic/m51/hst/hlsp_heritage_hst_acs-wfc_m51_f814w_v1_drz.fits"
