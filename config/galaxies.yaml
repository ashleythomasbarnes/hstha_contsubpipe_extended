# ================================================================
# galaxies.yaml — Target list and per-galaxy continuum-subtraction choices
# ================================================================
# Edit this file when a galaxy needs a different input file, filter choice,
# HDU index, or rerun behavior. Most reruns should only need changes here.
#
# Useful override examples:
#
# overrides:
#   ngc5068:
#     overwrite: true
#     f658n_file: "/full/path/to/specific_ngc5068_f658n_file.fits"
#   ngc2903:
#     preferred_instruments: ["acs", "uvis"]
# ================================================================

defaults:
  broad_filters: ["f555w", "f814w"]
  narrow_filters: ["f657n", "f658n"]
  preferred_instruments: ["uvis", "acs"]
  hdu_index: 0
  overwrite: false
